<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Catacomb Raider</title>
<meta name="description" content="Catacomb Raider: an endless-wave survivors-like set in a cursed graveyard. Free to play in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bone:#e8e2d0;--blue:#5aa9ff;--purple:#b07cff;--gold:#ffc94a;--bg:#0d1017;--panel:#151b26;--muted:#8a93a6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--bone)}
#wrap{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none}
#xpbar{position:absolute;left:0;right:0;top:0;height:8px;background:#000a;border-bottom:1px solid #000}
#xpfill{height:100%;width:0;background:#3fb8ff}
#lvl{position:absolute;left:10px;top:calc(14px + env(safe-area-inset-top));font-size:13px;text-shadow:2px 2px 0 #000}
#wave{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;font-size:15px;letter-spacing:2px;text-shadow:2px 2px 0 #000}
#wave small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px}
#kills{position:absolute;right:10px;top:calc(14px + env(safe-area-inset-top));font-size:13px;text-align:right;text-shadow:2px 2px 0 #000}
#dashBtn{position:absolute;right:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:2px solid #e8e2d066;background:#ffffff12;color:var(--bone);font:inherit;font-size:12px;letter-spacing:1px;pointer-events:auto;display:none;touch-action:none}
#dashBtn.cd{opacity:.35}
.touch #dashBtn{display:block}
#pauseBtn{position:absolute;left:10px;top:calc(34px + env(safe-area-inset-top));width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#151b26cc;border:2px solid #e8e2d044;color:var(--bone);cursor:pointer;pointer-events:auto;touch-action:none}
#pauseBtn:hover{border-color:var(--bone)}
.pmenu{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(300px,86vw)}
.pmenu .btn{width:100%}
.hidehud #hud{display:none}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#05070bcc;gap:16px;padding:20px;text-align:center}
#overlay.show{display:flex}
#overlay h1{font-family:'Silkscreen',monospace;font-size:26px;letter-spacing:6px;text-shadow:3px 3px 0 #000}
#overlay h2{font-family:'Silkscreen',monospace;font-size:18px;letter-spacing:4px;text-shadow:2px 2px 0 #000}
/* title screen */
.ts{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));pointer-events:auto}
.tbar{position:absolute;top:calc(20px + env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}
.ver{font-size:12px;letter-spacing:2px;color:var(--muted);background:none;border:0;padding:8px 0;cursor:default;font-family:inherit}
.icons{display:flex;gap:10px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid #e8e2d033;color:var(--bone);cursor:pointer;position:relative}
.ib.off{color:var(--muted)} .ib.off::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:2px;background:#e04848;transform:rotate(-45deg)}
.tmain{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}
.ttop{display:flex;flex-direction:column;align-items:center;gap:26px}
.logo{margin:0;font-family:'Grenze Gotisch',serif!important;font-weight:900;font-size:clamp(60px,10vw,120px)!important;letter-spacing:1px!important;line-height:.9;text-align:center;text-shadow:5px 5px 0 #000!important}
.sub{margin:-14px 0 0!important;font-size:13px!important;letter-spacing:6px;color:var(--muted)!important}
.chips{display:flex;gap:12px}
.chip{display:flex;align-items:baseline;gap:10px;padding:8px 16px;background:var(--panel);border:2px solid #e8e2d022}
.chip span{font-size:11px;letter-spacing:2px;color:var(--muted)} .chip b{font-family:'Silkscreen',monospace;font-weight:400;font-size:18px}
.tact{display:flex;flex-direction:column;align-items:center;gap:14px}
.primary{width:360px;max-width:100%;height:72px;background:var(--bone);color:#0d1017;border:0;box-shadow:6px 6px 0 #000;font-family:'Silkscreen',monospace;font-weight:700;font-size:26px;letter-spacing:4px;cursor:pointer}
.primary:hover{background:#fff}
.sec{display:flex;gap:14px}
.s2{width:173px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--panel);color:var(--bone);border:2px solid #e8e2d066;box-shadow:4px 4px 0 #000;font-family:'Silkscreen',monospace;font-size:15px;letter-spacing:2px;cursor:pointer}
.s2:hover{border-color:var(--bone)} .s2 small{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted)} .s2 small.g{color:var(--gold)}
.hint{display:flex;gap:28px;font-size:12px;color:var(--muted);letter-spacing:1px} .hint b{color:var(--bone);font-weight:400}
.hint .tch{display:none} .touch .hint .dsk{display:none} .touch .hint .tch{display:inline}
.ptp{margin-top:12px} .ptp:not(.on){display:none!important}
.touch.portrait .tmain{margin:0;flex:1;justify-content:space-between;padding-top:70px}
.touch.portrait .tact{width:100%;flex-direction:column-reverse;margin-bottom:14px}
.touch.portrait .primary{width:100%;height:76px}
.touch.portrait .sec{width:100%;display:grid;grid-template-columns:1fr 1fr}
.touch.portrait .s2{width:auto;height:60px}
.touch.portrait .logo{font-size:76px!important}
.mbr{display:none} .touch.portrait .mbr{display:inline}
.settings{display:flex;flex-direction:column;gap:10px;width:min(360px,90vw)}
.settings .row{justify-content:space-between;background:var(--panel);border:2px solid #e8e2d022;padding:10px 14px;font-size:12px}
#overlay p{font-size:12px;color:var(--muted);line-height:1.6;max-width:440px}
#cards{display:flex;gap:12px;flex-direction:row}
.touch.portrait #cards{flex-direction:column}
#cards{flex-wrap:wrap;justify-content:center}
.card{width:186px;background:var(--panel);border:3px solid var(--bone);padding:12px;cursor:pointer;text-align:left;color:var(--bone);font:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:5px 5px 0 #000;pointer-events:auto}
.touch.portrait .card{width:min(330px,88vw);flex-direction:row;align-items:center}
body:not(.touch) #wrap{cursor:crosshair}
.card:hover,.card:focus-visible{transform:translateY(-3px);outline:none;filter:brightness(1.2)}
.card .icon{width:44px;height:44px;flex:none;background:#0005;border:2px solid #0008;display:flex;align-items:center;justify-content:center;font-size:22px}
.card .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.card .name{font-size:13px;font-weight:bold}
.card .lv{font-size:11px;color:var(--muted)}
.card .desc{font-size:11px;line-height:1.4}
.card .key{font-size:10px;color:var(--muted)}
.touch .card .key{display:none}
.card .tag{font-size:9px;padding:2px 5px;background:var(--gold);color:#000;align-self:flex-start;letter-spacing:1px;font-weight:bold}
.card.rare{border-color:var(--blue)}.card.rare .lv{color:var(--blue)}
.card.epic{border-color:var(--purple)}.card.epic .lv{color:var(--purple)}
.card.legendary{border-color:var(--gold);box-shadow:0 0 0 2px #000,0 0 18px #ffc94a55,5px 5px 0 #000}.card.legendary .lv{color:var(--gold)}
.card .tag.relic{background:var(--gold)}
#bossbar{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);width:min(420px,72vw);display:none;text-align:center}
#bossbar.on{display:block}
#bossbar .bn{font-size:11px;letter-spacing:3px;margin-bottom:4px;text-shadow:2px 2px 0 #000;color:var(--gold)}
#bossbar .bb{height:8px;background:#000;border:1px solid #e8e2d055}
#bossfill{height:100%;width:100%;background:#c23b3b}
.btn{font:inherit;font-family:'Silkscreen',monospace;font-size:14px;letter-spacing:2px;padding:12px 26px;background:var(--panel);color:var(--bone);border:3px solid var(--bone);cursor:pointer;pointer-events:auto;box-shadow:5px 5px 0 #000}
.btn:hover{filter:brightness(1.25)}
.btn.sm{font-size:11px;padding:7px 12px;border-width:2px;box-shadow:3px 3px 0 #000;margin:0 3px}
.pt{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--muted)}
.stats{font-size:13px;line-height:1.8;color:var(--bone)}
.stats b{color:var(--gold)}
.g,.gold{color:var(--gold)} .gold{font-size:14px;letter-spacing:2px}
#goldh{position:absolute;right:10px;top:calc(30px + env(safe-area-inset-top));font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #000}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;width:min(760px,94vw);max-height:58vh;overflow:auto;touch-action:pan-y;text-align:left;pointer-events:auto}
.tile{background:var(--panel);border:2px solid #e8e2d033;padding:9px;display:flex;flex-direction:column;gap:6px;font-size:11px}
.tn{font-size:12px;font-weight:bold}.tn span{color:var(--gold)}
.pips{display:flex;gap:3px}.pips i{width:12px;height:5px;background:#000;border:1px solid #e8e2d044}.pips i.on{background:var(--gold);border-color:var(--gold)}
.td{color:var(--bone);line-height:1.4;min-height:30px}.nx{color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.achs{display:flex;flex-direction:column;gap:6px;width:min(520px,92vw);text-align:left;max-height:60vh;overflow:auto;touch-action:pan-y;pointer-events:auto}
.ach{background:var(--panel);border:2px solid #e8e2d022;padding:8px 10px;display:grid;grid-template-columns:1fr;gap:2px;font-size:11px;color:var(--muted)}
.ach b{color:var(--bone);font-size:12px}.ach em{font-style:normal;color:var(--muted)}
.ach.done{border-color:var(--gold)}.ach.done b{color:var(--gold)}.ach.done em{color:var(--bone)}
.cbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn.armed{border-color:#e04848;color:#ff8a8a}
.card.nob{opacity:.35}
.dmg{display:flex;flex-direction:column;gap:6px;width:min(420px,88vw);font-size:11px;text-align:left}
.dr{display:grid;grid-template-columns:1fr 110px 60px;gap:8px;align-items:center}
.dr i{color:var(--muted);font-style:normal}
.dr b{text-align:right;color:var(--bone)}
.bar{height:6px;background:#000;display:block}
.bar span{display:block;height:100%;background:var(--gold)}
#banner{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:5px;opacity:0;transition:opacity .35s;text-shadow:3px 3px 0 #000;white-space:nowrap;pointer-events:none}
#banner.on{opacity:1}
</style>
</head>
<body class="hidehud">
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="xpbar"><div id="xpfill"></div></div>
    <div id="lvl">LV 1</div>
    <div id="wave">WAVE 1<small>0:45</small></div>
    <div id="kills">0 KILLS</div><div id="goldh">◆ 0</div>
    <div id="bossbar"><div class="bn" id="bossname">THE GRAVEKEEPER</div><div class="bb"><div id="bossfill"></div></div></div>
    <button id="dashBtn" aria-label="Dash">DASH</button>
    <button id="pauseBtn" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg></button>
  </div>
  <div id="banner"></div>
  <div id="overlay" class="show"></div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('c'),ctx=cv.getContext('2d'),ov=$('overlay');

/* ---------- constants ---------- */
const TARGET_AREA=480*270;   // same visible world area in landscape and portrait
const WAVE_LEN=45, LULL=5, CELL=24;
const LOW_END=(window.matchMedia && matchMedia('(pointer: coarse)').matches) || (navigator.hardwareConcurrency||8)<=4;
const MAX_ENEMIES=LOW_END?260:350, PART_CAP=LOW_END?220:500;
const WEAPONS={
  dagger:{name:'Bone Dagger',icon:'†',unit:'dagger',blurb:'Fires at the nearest enemy.',levels:[null,
    {dmg:12,cd:.8,n:1,pierce:1},{dmg:12,cd:.8,n:2,pierce:1},{dmg:16,cd:.8,n:2,pierce:1},{dmg:16,cd:.68,n:2,pierce:2},
    {dmg:16,cd:.68,n:3,pierce:2},{dmg:22,cd:.68,n:3,pierce:2},{dmg:22,cd:.55,n:4,pierce:3},{dmg:28,cd:.45,n:4,pierce:3}],
    evo:{name:'Thousand Knives',pair:'cooldown',icon:'⚔',desc:'A relentless stream of piercing knives.',dmg:30,cd:.14,n:2,pierce:4,spd:290}},
  scythe:{name:'Grave Scythe',icon:'☾',unit:'',blurb:'Wide arc swipe in the direction you move. Hits everything in the arc.',levels:[null,
    {dmg:18,cd:1.5,rad:34,both:0},{dmg:24,cd:1.5,rad:34,both:0},{dmg:24,cd:1.5,rad:40,both:0},{dmg:24,cd:1.5,rad:40,both:1},
    {dmg:32,cd:1.5,rad:40,both:1},{dmg:32,cd:1.2,rad:40,both:1},{dmg:32,cd:1.2,rad:48,both:1},{dmg:44,cd:1.0,rad:48,both:1}],
    evo:{name:"Reaper's Harvest",pair:'might',icon:'☠',desc:'Reaps in a full circle. Every kill heals 1 HP.',dmg:70,cd:.9,rad:60,both:1,full:1}},
  orbs:{name:'Soul Orbs',icon:'✦',unit:'orb',blurb:'Souls circle you and burn whatever they touch.',levels:[null,
    {dmg:8,n:2,rad:26,on:3,off:3},{dmg:8,n:3,rad:26,on:3,off:3},{dmg:11,n:3,rad:26,on:3,off:3},{dmg:11,n:3,rad:32,on:3.5,off:3},
    {dmg:11,n:4,rad:32,on:3.5,off:3},{dmg:15,n:4,rad:32,on:3.5,off:3},{dmg:15,n:4,rad:32,on:4.5,off:2.5},{dmg:18,n:5,rad:32,on:4.5,off:2.5}],
    evo:{name:'Soul Storm',pair:'speed',icon:'✺',desc:'Seven souls that never rest, spinning wider and faster.',dmg:26,n:7,rad:40,on:1,off:0,spin:5}},
  blight:{name:'Blight Pool',icon:'☣',lock:'a1',unit:'pool',blurb:'Drops poison pools on nearby enemies. Damages and slows them.',levels:[null,
    {dmg:6,cd:3,rad:18,dur:3,n:1},{dmg:6,cd:3,rad:22,dur:3,n:1},{dmg:9,cd:3,rad:22,dur:3,n:1},{dmg:9,cd:3,rad:22,dur:3,n:2},
    {dmg:9,cd:3,rad:22,dur:4,n:2},{dmg:12,cd:3,rad:26,dur:4,n:2},{dmg:12,cd:2.4,rad:26,dur:4,n:2},{dmg:16,cd:2.4,rad:26,dur:4,n:3}],
    evo:{name:'Plague Garden',pair:'armor',icon:'❀',desc:'Huge plague fields that linger for 6 seconds.',dmg:22,cd:2,rad:34,dur:6,n:4}}
};
const MAX_WEAPONS=6;
const wStat=k=>W[k].evo?WEAPONS[k].evo:WEAPONS[k].levels[W[k].lvl];
const evoReady=()=>Object.keys(WEAPONS).filter(k=>W[k].lvl===8 && !W[k].evo && plv[WEAPONS[k].evo.pair]>0);

/* ---------- state ---------- */
let state='title', IW=480, IH=270, S=1, portrait=false, rotPause=0;
let P, st, plv, W={}, dmgDone={}, enemies=[], shots=[], gems=[], parts=[], ghosts=[], eshots=[], swings=[], pools=[], orbAng=0;
let wave, waveT, lull, spawnAcc, kills, tGame, pending, bossPending=0, curBoss=null, bwaves=[], marks=[], fwaves=[], relics={shovel:0,veil:0,fang:0,crown:0}, bossName='', bossKind='gravekeeper', cones=[], lanterns=[], spikes=[], cracks=[], allies=[], pickups=[], props=[], propT=3, chestsPending=0, cardKind='lvl', chests=[], evDone=new Set(), shake, cardsShownAt=0, curCards=[];

/* ---------- resize: integer pixel scaling, equal visible area ---------- */
function resize(){
  const DPR=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  const PW=Math.round(W*DPR), PH=Math.round(H*DPR);
  S=Math.max(1,Math.round(Math.sqrt(PW*PH/TARGET_AREA)));
  IW=Math.ceil(PW/S); IH=Math.ceil(PH/S);
  cv.width=IW; cv.height=IH;
  cv.style.width=(IW*S/DPR)+'px'; cv.style.height=(IH*S/DPR)+'px';
  ctx.imageSmoothingEnabled=false;
  const np=H>W;
  if(state==='play' && np!==portrait){ rotPause=.6; banner('',0); }
  portrait=np; document.body.classList.toggle('portrait',portrait);
}
addEventListener('resize',resize);

/* ---------- audio ---------- */
let ac=null; const lastS={};
let sfxBus=null, musBus=null, noiseBuf=null;
function initAudio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)();
    sfxBus=ac.createGain(); sfxBus.connect(ac.destination); musBus=ac.createGain(); musBus.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    applyAudioSettings(); }catch(e){} }
  else if(ac.state==='suspended') ac.resume();
}
function applyAudioSettings(){ if(!ac) return; const S=meta.settings||{}; sfxBus.gain.value=S.sfx===false?0:1; musBus.gain.value=S.music===false?0:.55; }
/* ---------- procedural chiptune: D minor. Stage loop (96 bpm), boss loop (132 bpm, drums), Blood Moon transposes down ---------- */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MUS={next:0,step:0};
/* E Phrygian / harmonic minor: Em - F - C - B. The F (flat 2nd) and the B major (D#) give it the dread. */
const PROG=[[40,[52,55,59]],[41,[53,57,60]],[36,[48,52,55]],[35,[47,51,54]]];
// melody: a falling b2 motif on bars 1 and 3 (E F E D B C B), answered by chord tones
const MOTIF={0:64,3:65,6:64,8:62,10:59,12:60,14:59};
function mnote(m,t,dur,type,vol,slide,lp){
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(mtof(m),t);
  if(slide) o.frequency.exponentialRampToValueAtTime(mtof(m)*slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(lp){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f).connect(g); } else o.connect(g);
  g.connect(musBus); o.start(t); o.stop(t+dur+.02);
}
function kick(t,v){ mnote(40,t,.16,'sine',v||.16,.25); }
function mnoise(t,dur,vol,hp){
  const src=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); src.buffer=noiseBuf; f.type='highpass'; f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); src.connect(f).connect(g).connect(musBus); src.start(t); src.stop(t+dur+.02);
}
function musicTick(){
  if(!ac || !musBus || ac.state!=='running') return;
  const playing=state==='play'||state==='cards', title=state==='title';
  if(!playing && !title){ MUS.next=0; return; }
  const boss=playing && !!curBoss, bpm=boss?168:title?76:140, sp=60/bpm/4, now=ac.currentTime;
  if(MUS.next<now) MUS.next=now+.05;
  const tr=playing && wave>20?-1:0, calm=playing && lull>0;
  while(MUS.next<now+.15){
    const t=MUS.next, i=MUS.step%16, bar=Math.floor(MUS.step/16)%4, [root,ch]=PROG[bar], r=root+tr;
    if(title){
      // slow dirge: low pedal, organ-ish fifths, one tolling bell per bar
      if(i===0||i===8) mnote(r,t,.9,'triangle',.08,0,500);
      if(i===0){ mnote(ch[0]+tr,t,1.8,'square',.012,0,700); mnote(ch[2]+tr,t,1.8,'square',.01,0,700); }
      if(i===0 && bar%2===0) mnote(ch[0]+tr+24,t,2.2,'sine',.03);
    } else if(calm){
      // lull: drums drop out, the pad and a slow pulse remain
      if(i%4===0) mnote(r,t,.25,'sawtooth',.03,0,400);
      if(i===0){ mnote(ch[0]+tr+12,t,1.6,'triangle',.03); mnote(ch[2]+tr+12,t,1.6,'triangle',.022); }
    } else if(boss){
      // boss: double-time kick, 16th saw bass with octave stabs, tritone arp, offbeat stabs
      if(i%2===0) kick(t,.15);
      if(i===4||i===12) mnoise(t,.14,.1,1400);

/* ---------- update ---------- */
function update(dt){
  if(rotPause>0){ rotPause-=dt; return; }
  tGame+=dt;

  // waves
  if(lull>0){
    lull-=dt;
    if(lull<=0){ wave++; waveT=0; if(wave===5) earn('a1'); if(wave===10) earn('a3'); if(wave===25) earn('a8'); banner(wave===21?'THE BLOOD MOON RISES':'WAVE '+wave,wave===21?2600:1600); if(wave===21) sfx.boss(); }
  } else {
    waveT+=dt;
    if(waveT>=WAVE_LEN && !curBoss){ lull=LULL; sfx.bell(); banner('THE BELL TOLLS',2200); }
    spawnAcc+=dt*waveDef(wave).rate*(curBoss?.5:1);
    while(spawnAcc>=1){ spawnAcc--; if(enemies.length<MAX_ENEMIES) spawnEnemy(); }
    waveEvents();
  }

  // movement
  let mx=0,my=0;
  if(keys.a||keys.arrowleft) mx--; if(keys.d||keys.arrowright) mx++;
  if(keys.w||keys.arrowup) my--; if(keys.s||keys.arrowdown) my++;
  mx+=joy.vx; my+=joy.vy;
  // mouse: walk toward the cursor, easing to a stop near it
  if(mouse.on && !mx && !my && !document.body.classList.contains('touch')){
    const r=cv.getBoundingClientRect(), k=IW/r.width;
    const dx=(mouse.x-r.left)*k-IW/2, dy=(mouse.y-r.top)*k-IH/2, d=Math.hypot(dx,dy);
    if(d>4){ const f=Math.min(1,(d-4)/18); mx=dx/d*f; my=dy/d*f; }
  }
  let m=Math.hypot(mx,my); if(m>1){ mx/=m; my/=m; m=1; }
  P.moving=m>.05;
  if(P.moving){ P.fx=mx/m; P.fy=my/m; P.walk+=dt*m*10; }
  P.dashCd=Math.max(0,P.dashCd-dt); P.inv-=dt; P.flash-=dt; if(st.regen) P.hp=Math.min(P.maxHp,P.hp+st.regen*dt); if(P.veil>0) P.veil-=dt;
  if(P.dashT>0){
    P.dashT-=dt; P.x+=P.ddx*270*dt; P.y+=P.ddy*270*dt;
    ghosts.push({x:P.x,y:P.y,life:.22});
  } else { P.x+=mx*72*st.speed*dt; P.y+=my*72*st.speed*dt; }
  for(const g of ghosts) g.life-=dt; ghosts=ghosts.filter(g=>g.life>0);

  buildGrid();

  updateWeapons(dt);

  // projectiles
  for(const s of shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.pierce<=0) continue;
    near(s.x,s.y,j=>{
      if(s.pierce<=0) return; const e=enemies[j];
      if(e.dead || s.hit.has(e)) return;
      const dx=e.x-s.x, dy=e.y-s.y, hr=e.r+3;
      if(dx*dx+dy*dy<hr*hr){ s.hit.add(e); s.pierce--; const sp=Math.hypot(s.vx,s.vy); dmgEnemy(e,s.dmg,'dagger',s.vx/sp*90,s.vy/sp*90); }
    });
  }
  shots=shots.filter(s=>s.life>0 && s.pierce>0);
  // enemies
  const far=Math.max(IW,IH)*1.1;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i]; if(e.dead) continue;
    const veiled=P.veil>0, tx=veiled?P.vtx:P.x, ty=veiled?P.vty:P.y;
    let dx=tx-e.x, dy=ty-e.y; const d=Math.hypot(dx,dy)||1, dP=veiled?Math.hypot(P.x-e.x,P.y-e.y):d;
    if(e.boss){
      if(d>far){ const [x,y]=edgePoint(); e.x=x; e.y=y; }
      BOSSDEF[e.t].ai(e,dt,dx,dy,d); e.flash-=dt;
      if(!veiled && (e.alpha===undefined||e.alpha>.5) && dP<P.r+e.r+1 && P.inv<=0 && P.dashT<=0){ if(hurt(e.dmg)) return; }
      continue;
    }
    if(d>far){ const [x,y]=edgePoint(); e.x=x; e.y=y; continue; }
    let vx=dx/d*e.spd, vy=dy/d*e.spd;
    if(e.t==='caster'){
      const want=d>135?1:d<95?-1:0, sd=e.spd*.55*e.dir;
      vx=dx/d*e.spd*want-dy/d*sd; vy=dy/d*e.spd*want+dx/d*sd;
      e.cool-=dt;
      if(e.cool<=0){
        if(d<Math.max(IW,IH)*.6){ eshots.push({x:e.x,y:e.y-3,vx:dx/d*78,vy:dy/d*78,life:4,dmg:10}); sfx.cast(); }
        e.cool=rnd(2.4,3.2);
      }
    }
    if(e.slow>0){ e.slow-=dt; vx*=.6; vy*=.6; }
    e.x+=(vx+e.kx)*dt; e.y+=(vy+e.ky)*dt;
    e.kx*=.86; e.ky*=.86; e.flash-=dt; e.ph+=dt*8;
    // separation
    near(e.x,e.y,j=>{
      if(j<=i) return; const o=enemies[j]; if(o.dead) return;
      const sx=o.x-e.x, sy=o.y-e.y, sd=sx*sx+sy*sy, R=e.r+o.r-1;
      if(sd<R*R && sd>0.01){ const q=Math.sqrt(sd), push=(R-q)*.25; if(o.boss){ e.x-=sx/q*push*2; e.y-=sy/q*push*2; } else { e.x-=sx/q*push; e.y-=sy/q*push; o.x+=sx/q*push; o.y+=sy/q*push; } }
    });
    // contact damage
    if(!veiled && dP<P.r+e.r+1 && P.inv<=0 && P.dashT<=0){ if(hurt(e.dmg)) return; }
  }
  // boss shockwaves: an expanding ring you can't outrun, so dash through it
  for(const w of bwaves){
    w.r+=w.spd*dt;
    const d=Math.hypot(P.x-w.x,P.y-w.y);
    if(!w.hit && Math.abs(d-w.r)<5 && P.inv<=0 && P.dashT<=0 && !(P.veil>0)){ w.hit=true; if(hurt(w.dmg)) return; }
  }
  bwaves=bwaves.filter(w=>w.r<w.max);
  // graves the boss raises
  for(const m of marks){ m.life-=dt; if(m.life<=0){ makeEnemy('runner',m.x,m.y,false); for(let k=0;k<6;k++) parts.push({x:m.x,y:m.y,vx:rnd(-40,40),vy:rnd(-60,-10),life:.4,c:'#4a3b2a'}); } }
  marks=marks.filter(m=>m.life>0);
  // relic: Gravekeeper's Shovel dash shockwave
  for(const w of fwaves){
    w.r+=200*dt;
    for(const e of enemies){ if(e.dead || w.hit.has(e)) continue; const d=Math.hypot(e.x-w.x,e.y-w.y);
      if(Math.abs(d-w.r)<e.r+3){ w.hit.add(e); dmgEnemy(e,w.dmg,'shovel',(e.x-w.x)/(d||1)*160,(e.y-w.y)/(d||1)*160); } }
  }
  fwaves=fwaves.filter(w=>w.r<w.max);
  // Matriarch bone spikes
  for(const sp of spikes){ sp.delay-=dt; if(sp.delay>0) continue; sp.life-=dt;
    if(!sp.hit && Math.hypot(P.x-sp.x,P.y-sp.y)<6 && canHitP()){ sp.hit=true; if(hurt(sp.dmg)) return; } }
  spikes=spikes.filter(sp=>sp.life>0);
  for(const c of cracks) c.life-=dt; cracks=cracks.filter(c=>c.life>0);
  // Widow scream cones
  for(const c of cones){
    c.life-=dt; if(c.hit) continue;
    const dx=P.x-c.x, dy=P.y-c.y, d=Math.hypot(dx,dy);
    let da=Math.atan2(dy,dx)-c.a; while(da>Math.PI) da-=Math.PI*2; while(da<-Math.PI) da+=Math.PI*2;
    if(d<c.range && Math.abs(da)<c.half && P.inv<=0 && P.dashT<=0 && !(P.veil>0)){ c.hit=true; if(hurt(c.dmg)) return; }
  }
  cones=cones.filter(c=>c.life>0);
  // Widow lanterns closing in
  for(const L of lanterns){
    L.t+=dt; L.a+=L.rot*dt; L.r=L.r0-(L.r0-14)*Math.min(1,L.t/L.dur);
    L.x=L.cx+Math.cos(L.a)*L.r; L.y=L.cy+Math.sin(L.a)*L.r;
    const dx=P.x-L.x, dy=P.y-L.y;
    if(dx*dx+dy*dy<36 && P.inv<=0 && P.dashT<=0 && !(P.veil>0)){ L.t=L.dur+1; if(hurt(L.dmg)) return; }
  }
  lanterns=lanterns.filter(L=>L.t<L.dur);
  // enemy projectiles (dash passes through them)
  for(const b of eshots){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    const dx=b.x-P.x, dy=b.y-P.y;
    if(dx*dx+dy*dy<40 && P.inv<=0 && P.dashT<=0 && !(P.veil>0)){ b.life=0; if(hurt(b.dmg)) return; }
  }
  eshots=eshots.filter(b=>b.life>0);
  // deaths
  for(const e of enemies) if(e.dead){
    kills++; if(kills===1000) earn('a7');
    if(e.boss){ bossDefeated(e); continue; }
    if(e.t==='splitter'){ const n=e.elite?6:3; for(let k=0;k<n;k++){ const a=k/n*Math.PI*2; const m=makeEnemy('mini',e.x+Math.cos(a)*6,e.y+Math.sin(a)*6,false); m.kx=Math.cos(a)*120; m.ky=Math.sin(a)*120; }
      for(let k=0;k<6;k++) parts.push({x:e.x,y:e.y,vx:rnd(-70,70),vy:rnd(-80,10),life:rnd(.3,.5),c:'#c6ec5a'}); }
    if(!e.elite && Math.random()<.012) pickups.push({t:'food',x:e.x,y:e.y,ph:0,life:40});
    if(e.elite) for(let k=0;k<3;k++) pickups.push({t:'gold',v:4,x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),ph:Math.random()*6,life:60});
    else if(Math.random()<.025) pickups.push({t:'gold',v:1,x:e.x,y:e.y,ph:Math.random()*6,life:40});
    const v=e.xp>1?e.xp:((wave>=6 && Math.random()<.25)?3:1);
    gems.push({x:e.x,y:e.y,v,pull:false});
    if(e.elite){ chests.push({x:e.x,y:e.y,ph:0}); shake=4; for(let k=0;k<14;k++) parts.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-110,20),life:rnd(.4,.7),c:k%2?'#ffc94a':'#cfd6c4'}); }
    for(let k=0;k<5;k++) parts.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-70,30),life:rnd(.25,.45),c:k<3?'#cfd6c4':'#6b7a66'});
  }
  enemies=enemies.filter(e=>!e.dead);

  // breakable candelabras (gameplay reason for the props: food, vacuum, gems)
  propT-=dt;
  if(propT<=0){ propT=rnd(5,8); if(props.length<6){ const a=Math.random()*Math.PI*2, m=Math.min(IW,IH); props.push({x:P.x+Math.cos(a)*rnd(m*.3,m*.45),y:P.y+Math.sin(a)*rnd(m*.3,m*.45),ph:Math.random()*6}); } }
  for(const pr of props){ pr.ph+=dt; const d=Math.hypot(pr.x-P.x,pr.y-P.y); if(d>Math.max(IW,IH)) pr.gone=true; else if(d<9) breakProp(pr);
    for(const sh of shots) if(!pr.gone && Math.abs(sh.x-pr.x)<5 && Math.abs(sh.y-pr.y+4)<7) breakProp(pr); }
  props=props.filter(p=>!p.gone);
  // floor pickups
  for(const pk of pickups){ pk.ph+=dt; pk.life-=dt;
    if(pk.t==='gold'){ const dx=P.x-pk.x, dy=P.y-pk.y, d=Math.hypot(dx,dy)||1; if(d<st.magnet || pk.pull){ pk.pull=true; pk.x+=dx/d*180*dt; pk.y+=dy/d*180*dt; } }
    if(Math.hypot(pk.x-P.x,pk.y-P.y)<10){ pk.got=true;
      if(pk.t==='gold'){ runGold+=pk.v*st.greed; sfx.coin(); }
      else if(pk.t==='food'){ P.hp=Math.min(P.maxHp,P.hp+30); sfx.eat(); for(let k=0;k<6;k++) parts.push({x:P.x,y:P.y-6,vx:rnd(-30,30),vy:rnd(-70,-30),life:.5,c:'#e04848'}); }
      else { for(const g of gems){ g.pull=true; g.fast=true; } for(const q of pickups) if(q.t==='gold') q.pull=true; sfx.vac(); banner('SOULS GATHER',1000); } } }
  pickups=pickups.filter(p=>!p.got && p.life>0);
  // chests
  for(const c of chests){ c.ph+=dt; const dx=P.x-c.x, dy=P.y-c.y; if(dx*dx+dy*dy<144){ c.got=true; chestsPending++; for(let k=0;k<10;k++) parts.push({x:c.x,y:c.y,vx:rnd(-70,70),vy:rnd(-100,0),life:rnd(.3,.6),c:'#ffc94a'}); } }
  chests=chests.filter(c=>!c.got);
  // gems
  if(gems.length>400){ const merged=gems.splice(0,60); gems.push({x:merged[0].x,y:merged[0].y,v:merged.reduce((a,g)=>a+g.v,0),pull:false}); }
  for(const g of gems){
    const dx=P.x-g.x, dy=P.y-g.y, d=Math.hypot(dx,dy)||1;
    if(d<st.magnet) g.pull=true;
    if(g.pull){ const sp=g.fast?420:160+(st.magnet-Math.min(d,st.magnet))*4; g.x+=dx/d*sp*dt; g.y+=dy/d*sp*dt; }
    if(d<7){ g.got=true; P.xp+=g.v*st.growth; sfx.gem(); }
  }
  gems=gems.filter(g=>!g.got);
  while(P.xp>=xpNeed(P.lvl)){ P.xp-=xpNeed(P.lvl); P.lvl++; pending++; }

  // particles
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; p.life-=dt; }
  parts=parts.filter(p=>p.life>0); if(parts.length>PART_CAP) parts.splice(0,parts.length-PART_CAP);
  shake*=.85;

  if((pending>0 || chestsPending>0 || bossPending>0) && state==='play') nextCards();
}

let vig=null, vigKey='';
/* ---------- sprite sheets (Higgsfield art, downscaled + palette-snapped). Each gets right/left-facing and white hit-flash copies ---------- */
const SPR={};
function loadSprite(key,src,fw,fh,n){
  const img=new Image(), s={ready:false,fw,fh,n}; SPR[key]=s;
  img.onload=()=>{ const mk=(flip,white)=>{ const c=document.createElement('canvas'); c.width=fw*n; c.height=fh; const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
      for(let i=0;i<n;i++){ if(flip){ g.save(); g.translate((i+1)*fw,0); g.scale(-1,1); g.drawImage(img,i*fw,0,fw,fh,0,0,fw,fh); g.restore(); } else g.drawImage(img,i*fw,0,fw,fh,i*fw,0,fw,fh); }
      if(white){ g.globalCompositeOperation='source-in'; g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height); } return c; };
    s.r=mk(false,false); s.l=mk(true,false); s.w=mk(false,true); s.wl=mk(true,true); s.ready=true; };
  img.src=src;
}
function spr(key,frame,x,y,left,white){ const s=SPR[key]; const c=white?(left?s.wl:s.w):(left?s.l:s.r); ctx.drawImage(c,(frame%s.n)*s.fw,0,s.fw,s.fh,Math.round(x),Math.round(y),s.fw,s.fh); }

      else { rect(x+(f>0?4:-5),y-8,1,11,'#c9cfda'); rect(x+(f>0?3:-6),y,3,1,'#ffc94a'); } } }
  // dash afterimages
  for(const g of ghosts){ ctx.globalAlpha=g.life*2; rect(g.x-ox-5,g.y-oy-8,10,16,'#5aa9ff'); }
  ctx.globalAlpha=1;
  // player (24x24 frame placeholder warden)
  if(state!=='title' || true){
    const x=P.x-ox, y=P.y-oy, blink=P.inv>0 && !(P.veil>0) && Math.floor(P.inv*25)%2===0;
    if(P.veil>0) ctx.globalAlpha=.3;
    if(!blink && SPR.warden && SPR.warden.ready){
      rect(x-6,y+9,12,2,'#0b0e14');
      spr('warden',P.moving?Math.floor(P.walk/2.5):0,x-9,y-16,P.fx<0,P.flash>0);
    } else if(!blink){
      const step=P.moving?(Math.floor(P.walk)%2):0;
      rect(x-6,y+9,12,2,'#0b0e14');
      rect(x-4,y+5,3,4-step,'#2b3d5e'); rect(x+1,y+5,3,3+step,'#2b3d5e');
      rect(x-6,y-4,12,10,P.flash>0?'#ffffff':'#3b5a8a'); rect(x-5,y-10,10,7,'#4b6fa6');
      rect(x-3,y-8,6,5,'#e8e2d0'); rect(x+(P.fx>0?0:-2),y-7,2,2,'#141a24');
      rect(x-1,y-4,2,9,'#c9a24a');
    }
    ctx.globalAlpha=1;
    if(state!=='title'){
      rect(x-9,y+12,18,3,'#000000'); rect(x-8,y+13,Math.max(0,Math.round(16*P.hp/P.maxHp)),1,'#e04848');
      const dc=1-P.dashCd/st.dashMax; rect(x-8,y+15,16,1,'#000000'); rect(x-8,y+15,Math.round(16*dc),1,dc>=1?'#5aa9ff':'#2d4f7a');
    }
  }
  // scythe swings
  for(const sw of swings){
    ctx.globalAlpha=Math.min(1,sw.life/.12);
    const sides=sw.full?[0,Math.PI/2,Math.PI,Math.PI*1.5]:sw.both?[0,Math.PI]:[0];
    for(const off of sides) for(let t=-1;t<=1.0001;t+=.07){
      const a=sw.a+off+t*1.05, w=1-Math.abs(t);
      for(let k=0;k<=Math.round(w*3);k++) rect(P.x-ox+Math.cos(a)*(sw.rad-k),P.y-2-oy+Math.sin(a)*(sw.rad-k),1,1,k?'#9aa3b5':'#e8e2d0');
    }
    ctx.globalAlpha=1;
  }
  // soul orbs
  if(W.orbs && W.orbs.lvl && W.orbs.active){
    const d=wStat('orbs');
    for(let i=0;i<d.n;i++){ const a=orbAng+i*Math.PI*2/d.n, x=P.x-ox+Math.cos(a)*d.rad, y=P.y-2-oy+Math.sin(a)*d.rad;
      const ta=a-.35; rect(P.x-ox+Math.cos(ta)*d.rad,P.y-2-oy+Math.sin(ta)*d.rad,1,1,'#5aa9ff');
      rect(x-2,y-1,4,2,'#7fd6ff'); rect(x-1,y-2,2,4,'#7fd6ff'); rect(x-1,y-1,2,2,'#ffffff'); }
  }
  // shots
  for(const s of shots){
    const x=s.x-ox, y=s.y-oy, d=Math.hypot(s.vx,s.vy);
    rect(x-1,y-1,3,3,'#ffc94a'); rect(x-s.vx/d*3,y-s.vy/d*3,1,1,'#ff9a3c'); rect(x-s.vx/d*5,y-s.vy/d*5,1,1,'#a8592a');
  }
  // particles
  for(const p of parts) rect(p.x-ox,p.y-oy,1,1,p.c);
  // fog vignette
  const bmv=state!=='title' && wave>20, gk=IW+'x'+IH+bmv;
  if(vigKey!==gk){ vigKey=gk; vig=ctx.createRadialGradient(IW/2,IH/2,Math.min(IW,IH)*.35,IW/2,IH/2,Math.max(IW,IH)*.75);
    vig.addColorStop(0,bmv?'rgba(120,20,30,0)':'rgba(60,90,70,0)'); vig.addColorStop(1,bmv?'rgba(110,18,28,.42)':'rgba(40,64,52,.38)'); }
  ctx.fillStyle=vig; ctx.fillRect(0,0,IW,IH);
  // joystick
  if(joy.id!==null){
    const r=cv.getBoundingClientRect(), k=IW/r.width;
    const jx=(joy.ox-r.left)*k, jy=(joy.oy-r.top)*k, kx=(joy.x-r.left)*k, ky=(joy.y-r.top)*k;
    ctx.strokeStyle='rgba(232,226,208,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(jx,jy,46*k,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(232,226,208,.35)'; ctx.beginPath(); ctx.arc(kx,ky,14*k,0,Math.PI*2); ctx.fill();
  }
  if(rotPause>0){ ctx.fillStyle='rgba(5,7,11,.5)'; ctx.fillRect(0,0,IW,IH); }
}

/* ---------- HUD ---------- */
const hud={lvl:$('lvl'),wave:$('wave'),kills:$('kills'),xp:$('xpfill'),dash:$('dashBtn')};
const hudCache={};
function setH(k,v,fn){ if(hudCache[k]!==v){ hudCache[k]=v; fn(v); } }
function drawHud(){
  if(state==='title' || !st) return;
  const rem=Math.max(0,Math.ceil(WAVE_LEN-waveT));
  setH('xp',Math.min(100,Math.round(P.xp/xpNeed(P.lvl)*200)/2)+'%',v=>hud.xp.style.width=v);
  setH('lvl','LV '+P.lvl,v=>hud.lvl.textContent=v);
  setH('wave',`WAVE ${wave}<small>${lull>0?'LULL':curBoss?'BOSS':'0:'+String(rem).padStart(2,'0')}</small>`,v=>hud.wave.innerHTML=v);
  setH('boss',!!curBoss,v=>$('bossbar').classList.toggle('on',v));
  if(curBoss) setH('bf',Math.max(0,Math.round(curBoss.hp/curBoss.max*200)/2)+'%',v=>$('bossfill').style.width=v);
  setH('kills',kills+(kills===1?' KILL':' KILLS'),v=>hud.kills.textContent=v);
  setH('gold','◆ '+Math.floor(runGold),v=>$('goldh').textContent=v);
  setH('dash',P.dashCd>0,v=>hud.dash.classList.toggle('cd',v));
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0; const STEP=1/60;
function frame(now){
  const dt=Math.min(.25,(now-last)/1000); last=now;
  if(state==='play'){ acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; if(state!=='play'){ acc=0; break; } } }
  else acc=0;
  render(); drawHud(); musicTick();
  requestAnimationFrame(frame);
}
resize(); showTitle(); requestAnimationFrame(frame);
})();
</script>
